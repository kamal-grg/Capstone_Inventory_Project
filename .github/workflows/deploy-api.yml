name: Deploy API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore API dependencies
      run: dotnet restore ./CustomerApp.API/CustomerApp.API.csproj

    - name: Build API
      run: dotnet build ./CustomerApp.API/CustomerApp.API.csproj --configuration Release

    - name: Publish API
      run: dotnet publish ./CustomerApp.API/CustomerApp.API.csproj --configuration Release --output ./publish

    - name: Deploy API to Azure
      uses: azure/webapps-deploy@v2
      with:
        app-name: kamalcusapi
        publish-profile: ${{ secrets.PUBLISH_PROFILE_API }}
        package: ./publish
